name: Trigger auto deployment for scalapoker

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/scalapoker-AutoDeployTrigger-40454fee-1d20-41af-82b8-1be02ffe6b7b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SCALAPOKER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SCALAPOKER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SCALAPOKER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.SCALAPOKER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SCALAPOKER_REGISTRY_PASSWORD }}
          containerAppName: scalapoker
          resourceGroup: pw-scalapoker
          imageToBuild: pprpjwas/scalapoker:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


