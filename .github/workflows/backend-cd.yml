name: Poker Server CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write 
      contents: read 

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SCALAPOKER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SCALAPOKER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SCALAPOKER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile
          registryUrl: docker.io
          registryUsername: ${{ secrets.SCALAPOKER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SCALAPOKER_REGISTRY_PASSWORD }}
          containerAppName: scalapoker
          resourceGroup: pw-scalapoker
          imageToBuild: ${{ secrets.SCALAPOKER_REGISTRY_USERNAME }}/scalapoker:${{ github.sha }}
