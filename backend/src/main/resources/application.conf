pekko {
  loglevel = "WARNING"
  log-dead-letters = 10
  log-dead-letters-during-shutdown = off

  actor {
    # Increase ask timeout for slow networks / test environments.
    # ClientConnection uses ctx.ask which respects this.
    default-dispatcher {
      fork-join-executor {
        parallelism-min = 2
        parallelism-factor = 2.0
        parallelism-max = 16
      }
    }
  }

  http {
    server {
      idle-timeout = 60s
      # Allow the WebSocket upgrade
      websocket.periodic-keep-alive-mode = ping
      websocket.periodic-keep-alive-max-idle = 30s
    }
  }
}

# Default ask timeout used by ClientConnection ctx.ask calls
pekko.actor.typed.default-ask-timeout = 10s